name: CI

on:
    push:
    pull_request:

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - run: npm run check

    browser:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                browser: [chromium, firefox]
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - run: npx playwright install --with-deps ${{ matrix.browser }}
            - run: npm run test:browser
              env:
                  BROWSER: ${{ matrix.browser }}
